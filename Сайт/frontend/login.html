
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Одобрено</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-page__bg">
            <div class="auth-page__gradient"></div>
            <div class="auth-page__shapes">
                <div class="auth-shape auth-shape--1"></div>
                <div class="auth-shape auth-shape--2"></div>
                <div class="auth-shape auth-shape--3"></div>
            </div>
        </div>

        <div class="auth-container">
            <a href="index.html" class="auth-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                На главную
            </a>

            <div class="auth-card animate-fade-in-up">
                <div class="auth-card__header">
                    <a href="index.html" class="nav__logo nav__logo--center">
                        <img src="assets/logo.png" alt="Одобрено" class="nav__logo-img nav__logo-img--sm">
                    </a>
                    <h1 class="auth-card__title">С возвращением</h1>
                    <p class="auth-card__subtitle">Войдите в свой аккаунт, чтобы продолжить</p>
                </div>

                <form class="auth-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
                        </div>
                        <span class="form-error" id="loginEmailError"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Пароль</label>
                        <div class="form-input-wrapper">
                            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                            <button type="button" class="form-input-toggle" id="togglePassword" aria-label="Показать пароль">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="loginPasswordError"></span>
                    </div>

                    <div class="form-row">
                        <label class="form-checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span class="form-checkbox__box"></span>
                            Запомнить меня
                        </label>
                        <a href="#" class="form-link">Забыли пароль?</a>
                    </div>

                    <button type="submit" class="btn btn--primary btn--block btn--lg" id="loginBtn">
                        <span class="btn__text">Войти</span>
                        <span class="btn__loader" hidden>
                            <span class="spinner"></span>
                        </span>
                    </button>

                    <div class="auth-form__alert" id="loginAlert" hidden></div>
                </form>

                <div class="auth-card__footer">
                    <p>Нет аккаунта? <a href="register.html" class="form-link">Зарегистрироваться</a></p>
                </div>

                <ul class="auth-card__features">
                    <li>14 дней пробного периода</li>
                    <li>Прогноз одобрения до подачи заявки</li>
                    <li>Данные защищены и не передаются третьим лицам</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
